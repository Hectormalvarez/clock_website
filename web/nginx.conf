# Static file server for the built clock app.
#
# This is the *app* container. It does no proxying and sets no site-wide
# security headers — the edge (nginx/) owns those. It runs as the unprivileged
# nginx user, hence port 8080 rather than 80.

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript image/svg+xml;

	# Container health probe used by HEALTHCHECK and compose depends_on.
	# no-store keeps intermediaries from ever caching the "ok" body.
	location = /healthz {
		access_log off;
		add_header Cache-Control "no-store";
		default_type text/plain;
		return 200 "ok\n";
	}

	# Vite emits content-hashed filenames, so these are safe to cache forever.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# index.html must always be revalidated by BROWSERS, otherwise a stale HTML
	# file can point at asset hashes that no longer exist.
	#
	# Cloudflare, however, is safe to cache it. Cloudflare-CDN-Cache-Control
	# is evaluated by Cloudflare's edge alone (and never sent downstream), so
	# the edge can serve this document without traversing the tunnel to the
	# origin for 10 minutes, while `no-cache` above still forces every browser
	# to revalidate. The short TTL replaces deploy-time cache purging on
	# purpose: purging would require storing Cloudflare API credentials, and a
	# 10-minute staleness window is the accepted trade-off (see ADR-0006).
	location = /index.html {
		add_header Cache-Control "no-cache";
		add_header Cloudflare-CDN-Cache-Control "max-age=600";
	}

	# The favicon is served at a stable, non-hashed URL, so it gets a shorter
	# cache lifetime than the content-hashed bundles above.
	location = /favicon.svg {
		expires 7d;
	}

	# This app has no client-side router, so an unknown path is a genuine 404
	# rather than an SPA fallback — which keeps HTTP status codes honest for
	# crawlers. `internal` keeps /404.html reachable only via the error handler.
	error_page 404 /404.html;

	location = /404.html {
		internal;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
