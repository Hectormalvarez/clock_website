# Static file server for the built clock app.
#
# This is the *app* container. It does no proxying and sets no site-wide
# security headers — the edge (nginx/) owns those. It runs as the unprivileged
# nginx user, hence port 8080 rather than 80.

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript image/svg+xml;

	# Container health probe used by HEALTHCHECK and compose depends_on.
	# no-store keeps intermediaries from ever caching the "ok" body.
	location = /healthz {
		access_log off;
		add_header Cache-Control "no-store";
		default_type text/plain;
		return 200 "ok\n";
	}

	# Vite emits content-hashed filenames, so these are safe to cache forever.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# index.html must always be revalidated by BROWSERS, otherwise a stale HTML
	# file can point at asset hashes that no longer exist.
	#
	# The Cloudflare EDGE caches this document via a zone Cache Rule (Edge TTL
	# 2 hours, the Free-plan floor) matching this hostname and
	# `/` + `/index.html`. An origin-set Cloudflare-CDN-Cache-Control header
	# was attempted first and verified to be ignored on the Free plan
	# (cf-cache-status stayed DYNAMIC), so the policy lives in the dashboard;
	# there is no deploy-time cache purge, because purging would require
	# storing Cloudflare API credentials. See ADR-0006.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# The favicon is served at a stable, non-hashed URL, so it gets a shorter
	# cache lifetime than the content-hashed bundles above.
	location = /favicon.svg {
		expires 7d;
	}

	# This app has no client-side router, so an unknown path is a genuine 404
	# rather than an SPA fallback — which keeps HTTP status codes honest for
	# crawlers. `internal` keeps /404.html reachable only via the error handler.
	error_page 404 /404.html;

	location = /404.html {
		internal;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
