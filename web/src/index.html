<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Simple Clock — Digital Clock &amp; Countdown Timer</title>

		<meta
			name="description"
			content="A clean, dark-themed digital clock with a built-in countdown timer. Runs entirely in your browser — no accounts, no tracking."
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#222" />
		<link rel="canonical" href="%SITE_URL%/" />

		<!-- Open Graph / social preview -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Simple Clock" />
		<meta
			property="og:title"
			content="Simple Clock — Digital Clock &amp; Countdown Timer"
		/>
		<meta
			property="og:description"
			content="A clean, dark-themed digital clock with a built-in countdown timer. Runs entirely in your browser — no accounts, no tracking."
		/>
		<meta name="twitter:card" content="summary" />
		<meta property="og:url" content="%SITE_URL%/" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	</head>
	<body>
		<div id="clock-container">
			<div class="clock" role="timer" tabindex="0"></div>
			<div class="timezone"></div>

			<div id="timer-wrapper">
				<button
					class="timer-toggle"
					id="timer-toggle"
					aria-expanded="false"
					aria-controls="timer-panel"
					aria-label="Timer"
					title="Timer"
				>
					<svg
						class="toggle-icon"
						viewBox="0 0 24 24"
						width="1em"
						height="1em"
						aria-hidden="true"
						focusable="false"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="14" r="7" />
						<path d="M12 10v4M10 2h4M12 2v3" />
					</svg>
					<span class="timer-toggle-text" hidden></span>
				</button>
				<div class="timer-panel" id="timer-panel" hidden>
					<h2 class="panel-title">Timer</h2>
					<div class="timer-display">--:--</div>
					<div class="timer-finish-time"></div>
					<div class="timer-controls">
						<button class="timer-dec-min" aria-label="Decrease minutes">
							−
						</button>
						<input
							class="timer-min"
							type="number"
							min="0"
							max="99"
							value="5"
							aria-label="Minutes"
						/>
						<span class="timer-colon">:</span>
						<input
							class="timer-sec"
							type="number"
							min="0"
							max="59"
							value="0"
							aria-label="Seconds"
						/>
						<button class="timer-inc-min" aria-label="Increase minutes">
							+
						</button>
					</div>
					<div class="timer-presets">
						<!-- Preset buttons rendered dynamically -->
					</div>
					<div class="timer-presets-bar">
						<button
							class="timer-preset-add"
							aria-label="Add preset"
							title="Add preset from current time"
						>
							+ Add
						</button>
					</div>
					<div class="timer-actions">
						<button class="timer-start" aria-label="Start timer">
							▶ Start
						</button>
						<button class="timer-reset" aria-label="Reset timer">↺</button>
					</div>
				</div>
			</div>

			<div id="alarm-wrapper">
				<button
					class="alarm-toggle"
					id="alarm-toggle"
					aria-expanded="false"
					aria-controls="alarm-panel"
					aria-label="Alarms"
					title="Alarms"
				>
					<svg
						class="toggle-icon"
						viewBox="0 0 24 24"
						width="1em"
						height="1em"
						aria-hidden="true"
						focusable="false"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="12" cy="13" r="7" />
						<path d="M12 10v3l2 2M5.5 5.5 3.5 3.5M18.5 5.5l2-2" />
					</svg>
				</button>
				<div class="alarm-panel" id="alarm-panel" hidden>
					<h2 class="panel-title">Alarms</h2>
					<div class="alarm-create">
						<div class="alarm-field">
							<label class="field-label" for="alarm-name">Name</label>
							<input
								id="alarm-name"
								class="alarm-name"
								type="text"
								maxlength="30"
								placeholder="Optional"
							/>
						</div>
						<div class="alarm-field">
							<label class="field-label" for="alarm-time">Time</label>
							<div class="alarm-time-row">
								<input id="alarm-time" class="alarm-time" type="time" />
								<button class="alarm-add">Add alarm</button>
							</div>
						</div>
					</div>
					<div class="alarm-error" role="alert"></div>
					<div class="alarm-list" aria-label="Alarm list" aria-live="polite">
						<!-- Alarm rows rendered dynamically -->
					</div>
					<p class="alarm-note">Alarms ring only while this page is open.</p>
				</div>
			</div>
		</div>

		<!-- Ringing overlay — lives outside the clock container so it can cover
		     the whole viewport -->
		<div class="alarm-overlay" hidden>
			<div
				class="alarm-overlay-card"
				role="alertdialog"
				aria-modal="true"
				aria-label="Alarm ringing"
				tabindex="-1"
			>
				<div class="alarm-overlay-name"></div>
				<div class="alarm-overlay-time"></div>
				<div class="alarm-overlay-actions">
					<button class="alarm-snooze">
						<svg
							class="button-icon"
							viewBox="0 0 24 24"
							width="1em"
							height="1em"
							aria-hidden="true"
							focusable="false"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M4 5h6l-6 7h6M14 10h6l-6 7h6" />
						</svg>
						Snooze 9m
					</button>
					<button class="alarm-dismiss">✕ Dismiss</button>
				</div>
			</div>
		</div>

		<div class="environment-marker"></div>

		<script type="module" src="./main.ts"></script>
	</body>
</html>
