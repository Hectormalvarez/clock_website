# Edge reverse proxy for the clock site.
#
# Terminates visitor traffic from the Cloudflare Tunnel and forwards it to the
# app container. Keeping the edge separate means the web image stays a plain
# static file server, and site-wide policy (security headers, real client IP
# handling, health endpoint) lives in exactly one place.

# Preserve the visitor's scheme when Cloudflare terminates TLS.
map $http_x_forwarded_proto $forwarded_proto {
	default $scheme;
	https   https;
	http    http;
}

# Cloudflare Tunnel supplies the real visitor address in CF-Connecting-IP;
# without this map X-Real-IP would be the tunnel connector's own address.
map $http_cf_connecting_ip $real_ip {
	default $remote_addr;
	"~.+"   $http_cf_connecting_ip;
}

# Only send `Connection: upgrade` for actual websocket upgrades (Vite HMR in
# the dev stack). Hardcoding "upgrade" breaks keepalive on ordinary requests.
map $http_upgrade $connection_upgrade {
	default upgrade;
	""      close;
}

# The dev and production web images both listen on 8080 (the unprivileged
# nginx port), so a single upstream is correct in every environment.
upstream web {
	server web:8080;
}

server {
	listen 8080;
	server_name _;

	# Edge-owned health probe; never proxied to the app.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Security headers. The page ships no inline scripts or styles, so the CSP
	# stays strict — no 'unsafe-inline' / 'unsafe-eval'.
	# X-XSS-Protection is deliberately omitted: it is obsolete, and modern
	# browsers ignore it in favour of the CSP above.
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

	location / {
		proxy_pass http://web;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $real_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}
