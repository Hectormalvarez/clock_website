<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clock</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div id="clock-container">
        <div id="clock" role="timer" tabindex="0"></div>
        <div id="timezone"></div>

        <div id="timer-wrapper">
            <button id="timer-toggle" aria-label="Toggle timer" title="Timer">⏱</button>
            <div id="timer-panel" hidden>
                <div id="timer-display">--:--</div>
                <div id="timer-controls">
                    <button id="timer-dec-min" aria-label="Decrease minutes">−</button>
                    <input id="timer-min" type="number" min="0" max="99" value="5">
                    <span class="timer-colon">:</span>
                    <input id="timer-sec" type="number" min="0" max="59" value="0">
                    <button id="timer-inc-sec" aria-label="Increase seconds">+</button>
                </div>
                <div id="timer-actions">
                    <button id="timer-start" aria-label="Start timer">▶ Start</button>
                    <button id="timer-reset" aria-label="Reset timer">↺</button>
                </div>
            </div>
        </div>
    </div>
    <div id="environment-marker"></div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
