name: Release

permissions:
  contents: read
  packages: write

# Runs after CI succeeds on main, so an image is only ever published from a
# commit that passed every guard. The job is inert until this workflow is
# enabled and the WEBHOOK_URL / WEBHOOK_TOKEN secrets exist — see
# docs/runbooks/deployment.md.
on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: hectormalvarez

jobs:
  build-and-push:
    name: Build & Push Images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - context: ./web
            name: web
            dockerfile: Dockerfile.prod
            # Baked into canonical/OG URLs and sitemap.xml. Set the SITE_URL
            # repository variable (Settings → Secrets and variables → Actions →
            # Variables) to the public origin, e.g. https://clock.example.net
            build-args: VITE_SITE_URL=${{ vars.SITE_URL }}
          - context: ./nginx
            name: nginx
            dockerfile: Dockerfile
            build-args: ""

    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          # Attach provenance attestations and an SBOM to every image.
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/clock_website-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/clock_website-${{ matrix.name }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger production deploy via webhook
        id: webhook
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_TOKEN }}" \
            -d '{"image_tag":"sha-${{ github.event.workflow_run.head_sha }}","ref":"main"}' \
            --max-time 300 \
            --connect-timeout 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 60 \
            --http1.1 \
            -4 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "response=$BODY" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            echo "Full response:"
            echo "$RESPONSE"
            exit 1
          fi
