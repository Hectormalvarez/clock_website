# Production stack: pre-built GHCR images, Cloudflare Tunnel, and the webhook
# deployer. Images are published by .github/workflows/release.yml and pulled by
# scripts/deploy.sh.
#
# `make prod-deploy` requires a .env.prod file (see .env.sample).

name: clock-prod

# Shared log rotation; keeps `docker logs` from filling the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ghcr.io/${REGISTRY_OWNER:-hectormalvarez}/clock_website-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        # Public origin for canonical/OG URLs and sitemap.xml. release.yml
        # passes the SITE_URL repository variable here.
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    restart: unless-stopped
    # The image ships a HEALTHCHECK against /healthz; the edge waits on it.
    cap_drop:
      - ALL
    logging: *default-logging

  nginx:
    image: ghcr.io/${REGISTRY_OWNER:-hectormalvarez}/clock_website-nginx:${IMAGE_TAG:-latest}
    build: ./nginx
    restart: unless-stopped
    # Publish on loopback only. The Cloudflare Tunnel connector — and local
    # tooling such as `make prod-verify` — reach the stack through
    # http://127.0.0.1:9418. Nothing is exposed to the public internet directly.
    ports:
      - "127.0.0.1:${PROD_VERIFY_PORT:-9418}:8080"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - nginx
    cap_drop:
      - ALL
    logging: *default-logging

  webhook:
    build: ./webhook
    command: -verbose -hooks=/etc/webhook/hooks.json -hotreload
    restart: unless-stopped
    env_file: .env.prod
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?WEBHOOK_TOKEN is required}
    volumes:
      # The host repo is mounted at /opt/clock_website inside this container.
      # The identical-absolute-path mount is required so that when docker
      # compose runs inside this container (via the mounted Docker socket),
      # relative bind-mount sources in this file resolve to the same absolute
      # paths on the host filesystem.
      - .:/opt/clock_website
      - /var/run/docker.sock:/var/run/docker.sock
      - ./webhook/hooks.json:/etc/webhook/hooks.json.template:ro
    depends_on:
      - nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging: *default-logging
